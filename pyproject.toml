[project]
name = "moviematch"
version = "1.0.0"
description = "A graph-based movie recommender with a desktop interface, built on the MovieLens dataset."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Capucine" }, { name = "Mavi" }, { name = "Syaikha" }, { name = "Tamima" }]
dependencies = ["plotly>=5.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests", "moviematch"]
addopts = "--doctest-modules"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
